name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLC_VERSION: 0.8.24
  SOLC_SHA256: fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f

jobs:
  build:
    name: Build contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install solc
        run: |
          curl -sSL -o /usr/local/bin/solc \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux"
          echo "${SOLC_SHA256}  /usr/local/bin/solc" | sha256sum -c -
          chmod +x /usr/local/bin/solc
          solc --version

      - name: Compile
        run: ./scripts/build.sh

      # The ABI the browser loads is generated from compiler output. If the
      # committed copy drifts from the source, the interface and the deployed
      # contract can disagree — which is exactly the bug class this replaces.
      - name: Generated artifacts are current
        run: |
          if ! git diff --quiet -- contract/abi contract/build web/vendor/abi.js; then
            echo "::error::Generated artifacts are out of date. Run ./scripts/build.sh and commit the result."
            git diff --stat -- contract/abi contract/build web/vendor/abi.js
            exit 1
          fi

      - name: Contract size
        run: |
          size=$(( $(wc -c < contract/build/GenesisL1APIRegistry.bin) / 2 ))
          echo "registry deploy bytecode: ${size} bytes"
          test "$size" -lt 24576 || { echo "::error::Registry exceeds EIP-170"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            contract/abi/
            contract/build/
            web/vendor/abi.js
          retention-days: 7

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install solc
        run: |
          curl -sSL -o /usr/local/bin/solc \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux"
          echo "${SOLC_SHA256}  /usr/local/bin/solc" | sha256sum -c -
          chmod +x /usr/local/bin/solc

      - run: pip install -r requirements-dev.txt
      - run: python test/test_registry.py

  checker:
    name: Checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r bot/requirements.txt
      - run: python test/test_checker.py

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: contract-artifacts

      - run: pip install -r requirements-dev.txt -r bot/requirements.txt
      - run: npm ci
      - run: node test/e2e.js

  syntax:
    name: Syntax and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JavaScript parses
        run: |
          for file in web/app.js web/config.js test/e2e.js; do
            node --check "$file"
          done

      - name: Python compiles
        run: python -m compileall -q bot scripts test

      - name: No secret material committed
        run: |
          # A private key in web/ would be served to every visitor.
          if grep -rInE '(CHECKER|DEPLOYER)_PRIVATE_KEY[[:space:]]*[=:][[:space:]]*["'"'"']?0x[0-9a-fA-F]{64}' \
              --exclude-dir=node_modules . ; then
            echo "::error::A private key looks committed."
            exit 1
          fi
          if grep -rIn "privateKey" web/ --exclude-dir=vendor ; then
            echo "::error::web/ must never reference a private key."
            exit 1
          fi
